[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lil-tweak-core"
version = "0.1.0"
description = "Trusted execution core for the owner-only Lil Tweak code engineer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "openai>=1.109,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["lil_tweak"]

[tool.ruff]
target-version = "py312"
line-length = 100
