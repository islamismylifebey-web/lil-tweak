name: Apply Test World schema v3 source patch

on:
  push:
    branches:
      - feature/tueiq-durable-test-world
    paths:
      - ".github/workflows/tueiq-schema-v3-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tueiq-durable-test-world
          fetch-depth: 0
      - name: Patch schema v3 source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "core/main.py",
              'SELECT EXISTS (SELECT 1 FROM lil_tweak_schema_version WHERE version=2)',
              'SELECT EXISTS (SELECT 1 FROM lil_tweak_schema_version WHERE version=3)',
          )

          p = Path("scripts/install-digitalocean.sh")
          text = p.read_text()
          operations = [
              (
                  'MIGRATION_002_SOURCE="${PROJECT_DIR}/core/migrations/002_fencing.sql"\n',
                  'MIGRATION_002_SOURCE="${PROJECT_DIR}/core/migrations/002_fencing.sql"\nMIGRATION_003_SOURCE="${PROJECT_DIR}/core/migrations/003_test_world.sql"\n',
              ),
              (
                  '    "${MIGRATION_002_SOURCE}" \\\n    "${ROLLBACK_HELPER}"',
                  '    "${MIGRATION_002_SOURCE}" \\\n    "${MIGRATION_003_SOURCE}" \\\n    "${ROLLBACK_HELPER}"',
              ),
              (
                  'install -D -m 0400 "${MIGRATION_002_SOURCE}" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/002_fencing.sql"\n',
                  'install -D -m 0400 "${MIGRATION_002_SOURCE}" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/002_fencing.sql"\ninstall -D -m 0400 "${MIGRATION_003_SOURCE}" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/003_test_world.sql"\n',
              ),
              (
                  'authorize_release_file "${SERVICE_HOME}/.local/share/lil-tweak/migrations/002_fencing.sql" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/002_fencing.sql" \\\n  0400 "${service_uid}" "${service_gid}"\n',
                  'authorize_release_file "${SERVICE_HOME}/.local/share/lil-tweak/migrations/002_fencing.sql" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/002_fencing.sql" \\\n  0400 "${service_uid}" "${service_gid}"\nauthorize_release_file "${SERVICE_HOME}/.local/share/lil-tweak/migrations/003_test_world.sql" \\\n  "${staging_dir}/.local/share/lil-tweak/migrations/003_test_world.sql" \\\n  0400 "${service_uid}" "${service_gid}"\n',
              ),
              (
                  'if [[ "${schema_version}" != "0" && "${schema_version}" != "1" \\\n    && "${schema_version}" != "2" ]]; then',
                  'if [[ "${schema_version}" != "0" && "${schema_version}" != "1" \\\n    && "${schema_version}" != "2" && "${schema_version}" != "3" ]]; then',
              ),
              (
                  'if [[ "${schema_version}" == "1" ]]; then\n  apply_migration "${MIGRATION_002_SOURCE}"\n  schema_version="2"\nfi\n[[ "${schema_version}" == "2" ]] || die \'database did not reach schema version 2\'',
                  'if [[ "${schema_version}" == "1" ]]; then\n  apply_migration "${MIGRATION_002_SOURCE}"\n  schema_version="2"\nfi\nif [[ "${schema_version}" == "2" ]]; then\n  apply_migration "${MIGRATION_003_SOURCE}"\n  schema_version="3"\nfi\n[[ "${schema_version}" == "3" ]] || die \'database did not reach schema version 3\'',
              ),
          ]
          for old, new in operations:
              if old not in text:
                  raise SystemExit(f"installer pattern missing: {old!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)

          replace(
              "scripts/lil-tweak-service-files.py",
              '    (".local/share/lil-tweak/migrations/002_fencing.sql", 0o400),\n',
              '    (".local/share/lil-tweak/migrations/002_fencing.sql", 0o400),\n    (".local/share/lil-tweak/migrations/003_test_world.sql", 0o400),\n',
          )
          replace(
              "scripts/lil-tweak-rollback.py",
              '    ("/var/lib/lil-tweak/.local/share/lil-tweak/migrations/002_fencing.sql", "regular", False),\n',
              '    ("/var/lib/lil-tweak/.local/share/lil-tweak/migrations/002_fencing.sql", "regular", False),\n    ("/var/lib/lil-tweak/.local/share/lil-tweak/migrations/003_test_world.sql", "regular", False),\n',
          )
          replace(
              "deploy/tests/test_service_files.py",
              '    ".local/share/lil-tweak/migrations/002_fencing.sql": (0o400, b"select 2;\\n"),\n',
              '    ".local/share/lil-tweak/migrations/002_fencing.sql": (0o400, b"select 2;\\n"),\n    ".local/share/lil-tweak/migrations/003_test_world.sql": (0o400, b"select test world;\\n"),\n',
          )

          integrity = Path("deploy/postgres-integrity.sql")
          sql = integrity.read_text()
          sql = sql.replace("ARRAY[1, 2] AS versions_ok", "ARRAY[1, 2, 3] AS versions_ok", 1)
          sql = sql.replace(
              ") AS approval_invariant_ok\n)",
              ") AS approval_invariant_ok,\n        to_regclass('public.lil_tweak_test_worlds') IS NOT NULL\n            AND to_regclass('public.lil_tweak_test_world_attempts') IS NOT NULL AS test_world_tables_ok\n)",
              1,
          )
          sql = sql.replace(
              "SELECT NOT (versions_ok AND lease_generation_ok AND approval_invariant_ok)",
              "SELECT NOT (versions_ok AND lease_generation_ok AND approval_invariant_ok AND test_world_tables_ok)",
              1,
          )
          sql = sql.replace("schema version 2 integrity check failed", "schema version 3 integrity check failed", 1)
          if "ARRAY[1, 2, 3]" not in sql or "test_world_tables_ok" not in sql:
              raise SystemExit("integrity patch failed")
          integrity.write_text(sql)

          replace(
              "deploy/tests/test_operations_contract.py",
              '            "array[1, 2]",\n',
              '            "array[1, 2, 3]",\n            "lil_tweak_test_worlds",\n            "lil_tweak_test_world_attempts",\n',
          )
          replace(
              "tests/deployment-contract.test.mjs",
              '  assert.match(installer, /\\$\\{schema_version\\}" == "2"/);\n  assert.match(installer, /apply_migration "\\$\\{MIGRATION_002_SOURCE\\}"/);',
              '  assert.match(installer, /\\$\\{schema_version\\}" == "2"/);\n  assert.match(installer, /\\$\\{schema_version\\}" == "3"/);\n  assert.match(installer, /apply_migration "\\$\\{MIGRATION_002_SOURCE\\}"/);\n  assert.match(installer, /apply_migration "\\$\\{MIGRATION_003_SOURCE\\}"/);',
          )

          docs = Path("docs/operations/digitalocean.md")
          text = docs.read_text()
          old = "The installer accepts only schema versions zero, one, or two and advances one known migration at a time. A failed `002_fencing.sql` transaction leaves version one available for a safe installer retry. The deployment verifier requires version two, the generation-fencing column, and the one-proposal approval constraint before cutover. For migration 003 or above, add another separately reviewed forward migration and teach the installer the next exact step. Never edit an applied migration and never let application startup apply schema changes."
          new = "The installer accepts only schema versions zero, one, two, or three and advances one known migration at a time. A failed `002_fencing.sql` transaction leaves version one available for a safe installer retry; a failed `003_test_world.sql` transaction leaves version two available for the same safe retry. The deployment verifier requires schema version three, the generation-fencing column, the one-proposal approval constraint, and both durable Test World tables before cutover. Never edit an applied migration and never let application startup apply schema changes."
          if old not in text:
              raise SystemExit("operations schema paragraph missing")
          docs.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source-contract patch
        run: |
          git config user.name "Tueiq Test World CI"
          git config user.email "actions@users.noreply.github.com"
          git add core/main.py scripts/install-digitalocean.sh scripts/lil-tweak-service-files.py scripts/lil-tweak-rollback.py deploy/postgres-integrity.sql deploy/tests/test_service_files.py deploy/tests/test_operations_contract.py tests/deployment-contract.test.mjs docs/operations/digitalocean.md
          git diff --cached --check
          git commit -m "chore: advance Test World runtime schema to v3"
          git push origin HEAD:feature/tueiq-durable-test-world
