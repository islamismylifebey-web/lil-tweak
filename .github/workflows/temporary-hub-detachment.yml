name: Temporary Hub detachment verification

on:
  push:
    branches:
      - fix/detach-tweak-from-galor-hub

permissions:
  contents: read

jobs:
  full:
    name: Full repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository verification
        env:
          NODE_OPTIONS: --experimental-strip-types
          PYTHONDONTWRITEBYTECODE: '1'
        run: npm run verify
