name: Apply exact runner connection type fix

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829

permissions:
  contents: write

concurrency:
  group: fix-runner-connection-types
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/runner-health-handshake-heartbeat-20260829
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: ""

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Remove only the two redundant casts
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("liltweak/runner_connection.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "return cast(str, tenant_id), job_id, cast(Mapping[str, object], result)":
                  "return tenant_id, job_id, cast(Mapping[str, object], result)",
              "runner_id=cast(str, runner_id),": "runner_id=runner_id,",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact source match: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --locked --group dev --python 3.12.13
          uv run --no-sync --offline ruff check liltweak/runner_connection.py
          uv run --no-sync --offline ruff format --check liltweak/runner_connection.py
          uv run --no-sync --offline mypy liltweak/runner_connection.py

      - name: Commit source with exact manifest binding
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF_NAME" = "feature/runner-health-handshake-heartbeat-20260829"
          git config user.name "GALOR Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add liltweak/runner_connection.py
          git rm .github/workflows/fix-runner-connection-types.yml
          python scripts/generate_final_manifest.py
          git add FINAL_FILE_MANIFEST.json
          git diff --cached --check
          git commit -m "fix: satisfy runner connection type contract"
          git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829
