name: Tueiq GitHub Runner
run-name: Tueiq Runner ${{ inputs.execution_id || format('pr-{0}', github.event.pull_request.number) }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Owner-scoped Tueiq execution ID
        required: true
        type: string
      expected_commit:
        description: Exact source commit
        required: true
        type: string
      manifest_base64:
        description: Canonical bounded manifest
        required: true
        type: string
      manifest_digest:
        description: Expected manifest SHA-256
        required: true
        type: string
      acknowledge_builder_only:
        description: Runner evidence is not independent verification
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - "core/lil_tweak/github_runner.py"
      - "core/tests/test_github_runner*.py"
      - "scripts/tueiq_github_runner.py"
      - ".github/workflows/tueiq-runner.yml"

permissions:
  contents: read

concurrency:
  group: tueiq-runner-${{ inputs.execution_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      LIL_TWEAK_LIVE_MODEL_ENABLED: "false"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      CONTROL_DIR: ${{ github.workspace }}/control
      SOURCE_DIR: ${{ github.workspace }}/source
      PYTHONPATH: ${{ github.workspace }}/control
    steps:
      - name: Checkout trusted control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: control
          clean: true
          lfs: false
          submodules: false
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.event.pull_request.head.sha }}
          path: source
          clean: true
          lfs: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare private temporary root
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          umask 077
          runner_tmp="$RUNNER_TEMP/lil-tweak-runner"
          mkdir -p -- "$runner_tmp"
          chmod 0700 -- "$runner_tmp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_tmp" "$runner_tmp" "$runner_tmp" >> "$GITHUB_ENV"
      - name: Prepare exact manifest
        env:
          MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
          EXPECTED_EXECUTION_ID: ${{ inputs.execution_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_DIGEST: ${{ inputs.manifest_digest }}
          BUILDER_ONLY: ${{ inputs.acknowledge_builder_only }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from core.lil_tweak.github_runner import RunnerManifest

          commit = subprocess.check_output(["git", "-C", os.environ["SOURCE_DIR"], "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "-C", os.environ["SOURCE_DIR"], "rev-parse", "HEAD^{tree}"], text=True).strip()
          canary_path = ".tueiq-runner-canary.txt"
          patch = (
              f"--- /dev/null\n+++ b/{canary_path}\n@@ -0,0 +1 @@\n"
              f"+tueiq-runner-canary:{os.environ['GITHUB_RUN_ID']}\n"
          )
          manifest = RunnerManifest.issue(
              execution_id=f"pr-{os.environ['GITHUB_RUN_ID']}",
              repository=os.environ["GITHUB_REPOSITORY"],
              source_commit=commit,
              source_tree=tree,
              patch=patch,
              authorized_paths=(canary_path,),
              actions=("inspect_source", "apply_patch", "compile_python", "git_diff"),
              issued_at=datetime.now(UTC),
              expires_at=datetime.now(UTC) + timedelta(minutes=10),
              authority_digest=hashlib.sha256(f"pr:{os.environ['GITHUB_RUN_ID']}".encode()).hexdigest(),
          )
          Path(os.environ["RUNNER_TEMP"], "tueiq-manifest.json").write_text(
              json.dumps(manifest.as_dict(), sort_keys=True, separators=(",", ":")), encoding="utf-8"
          )
          PY
          else
            test "$BUILDER_ONLY" = "true"
            python3 - <<'PY'
          import base64
          import json
          import os
          import secrets
          from pathlib import Path
          from core.lil_tweak.github_runner import RunnerManifest

          raw = base64.b64decode(os.environ["MANIFEST_BASE64"].encode("ascii"), validate=True)
          value = json.loads(raw.decode("utf-8", "strict"))
          manifest = RunnerManifest.parse(value)
          if (
              manifest.execution_id != os.environ["EXPECTED_EXECUTION_ID"]
              or manifest.source_commit != os.environ["EXPECTED_COMMIT"]
              or not secrets.compare_digest(manifest.manifest_digest, os.environ["EXPECTED_DIGEST"])
          ):
              raise SystemExit("dispatch binding failed")
          Path(os.environ["RUNNER_TEMP"], "tueiq-manifest.json").write_bytes(raw)
          PY
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Execute bounded Tueiq job
        run: |
          set -Eeuo pipefail
          python3 "$CONTROL_DIR/scripts/tueiq_github_runner.py" \
            --manifest "$RUNNER_TEMP/tueiq-manifest.json" \
            --workspace "$SOURCE_DIR" \
            --output "$RUNNER_TEMP/tueiq-runner-output"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tueiq-runner-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/tueiq-runner-output/runner-receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Remove manifest and receipt
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/tueiq-manifest.json"
          rm -rf -- "$RUNNER_TEMP/tueiq-runner-output"
