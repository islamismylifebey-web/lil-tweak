name: PR 12 exact completion

on:
  push:
    branches:
      - feature/tweak-private-runner-control-plane-20260901

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr12-exact-completion
  cancel-in-progress: false

env:
  EXPECTED_PARENT_SHA: ba1b19fdd62798e36edb5498138cbe99a7892b1e
  TARGET_BRANCH: feature/tweak-private-runner-control-plane-20260901
  SOURCE_DATE_EPOCH: "1735689600"
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.11.33"

jobs:
  repair-and-qualify:
    name: Repair, verify, and qualify exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
      gate3_run_id: ${{ steps.gate3.outputs.run_id }}
    steps:
      - name: Checkout guarded candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Prove this is the one authorized bootstrap commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/pr12-exact-completion.yml"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Restore the locked development environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev --python "$PYTHON_VERSION"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/runner-control-plane/package-lock.json

      - name: Restore the locked Worker environment
        working-directory: cloudflare/runner-control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Add regression checks and prove they fail before the repair
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_pr12_review_regressions.py <<'PY'
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          def test_offer_verification_and_persistence_share_one_clock_read() -> None:
              source = (
                  ROOT / "cloudflare" / "runner-control-plane" / "src" / "index.ts"
              ).read_text(encoding="utf-8")
              assert source.count("const nowMs = Date.now();") == 1
              assert (
                  "verifyDispatchAttestation(body.attestation, env, nowMs)" in source
              )
              assert ".offer(verified, body.manifest, nowMs)" in source
              assert ".offer(verified, body.manifest, Date.now())" not in source


          def test_execution_lease_rejection_preserves_the_specific_reason() -> None:
              source = (
                  ROOT
                  / "liltweak"
                  / "providers"
                  / "self_hosted"
                  / "galor_tweak_runner.py"
              ).read_text(encoding="utf-8")
              assert "except ExecutionLeaseError as exc:" in source
              assert 'f"execution lease rejected: {exc}"' in source
              assert '"execution lease was rejected"' not in source
          PY

          if uv run --no-sync --offline pytest -q tests/test_pr12_review_regressions.py; then
            echo "Regression checks unexpectedly passed before the source repair." >&2
            exit 1
          fi

      - name: Apply only the two reviewed source repairs
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --offline python - <<'PY'
          from pathlib import Path

          index_path = Path("cloudflare/runner-control-plane/src/index.ts")
          index = index_path.read_text(encoding="utf-8")
          old_verify = (
              "const verified = await verifyDispatchAttestation("
              "body.attestation, env, Date.now());"
          )
          new_verify = (
              "const nowMs = Date.now();\n"
              "    const verified = await verifyDispatchAttestation("
              "body.attestation, env, nowMs);"
          )
          old_offer = "await controlObject(env).offer(verified, body.manifest, Date.now()),"
          new_offer = "await controlObject(env).offer(verified, body.manifest, nowMs),"
          if index.count(old_verify) != 1:
              raise SystemExit(f"expected one verification clock expression, found {index.count(old_verify)}")
          if index.count(old_offer) != 1:
              raise SystemExit(f"expected one persistence clock expression, found {index.count(old_offer)}")
          index = index.replace(old_verify, new_verify, 1).replace(old_offer, new_offer, 1)
          index_path.write_text(index, encoding="utf-8")

          provider_path = Path(
              "liltweak/providers/self_hosted/galor_tweak_runner.py"
          )
          provider = provider_path.read_text(encoding="utf-8")
          old_except = "except ExecutionLeaseError:"
          new_except = "except ExecutionLeaseError as exc:"
          old_message = '"execution lease was rejected"'
          new_message = 'f"execution lease rejected: {exc}"'
          if provider.count(old_except) != 1:
              raise SystemExit(f"expected one generic lease handler, found {provider.count(old_except)}")
          if provider.count(old_message) != 1:
              raise SystemExit(f"expected one generic lease message, found {provider.count(old_message)}")
          provider = provider.replace(old_except, new_except, 1).replace(
              old_message, new_message, 1
          )
          provider_path.write_text(provider, encoding="utf-8")
          PY

      - name: Prove the focused regression checks are green
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --offline pytest -q tests/test_pr12_review_regressions.py

      - name: Verify the complete Python gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync --offline ruff check .
          uv run --no-sync --offline ruff format --check .
          uv run --no-sync --offline mypy
          uv run --no-sync --offline pytest -q

      - name: Verify the complete Worker gate
        working-directory: cloudflare/runner-control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm test
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.typecheck ? 0 : 1)'; then
            npm run typecheck
          fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.check ? 0 : 1)'; then
            npm run check
          fi

      - name: Regenerate deterministic supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pr12-dist"
          mkdir -p "$RUNNER_TEMP/pr12-dist"
          uv build --offline --out-dir "$RUNNER_TEMP/pr12-dist"
          wheel="$(find "$RUNNER_TEMP/pr12-dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/pr12-dist" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" uv run --no-sync --offline python \
            scripts/generate_supply_chain_artifacts.py \
            --output-directory . \
            --wheel-artifact "$wheel" \
            --sdist-artifact "$sdist"

      - name: Stage the exact final tree and regenerate its manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr12-exact-completion.yml
          git add \
            cloudflare/runner-control-plane/src/index.ts \
            liltweak/providers/self_hosted/galor_tweak_runner.py \
            tests/test_pr12_review_regressions.py \
            BUILD_PROVENANCE.json \
            SUPPLY_CHAIN_SBOM.json \
            LICENSE_INVENTORY.json \
            DEPENDENCY_SECURITY_SCAN_REPORT.json
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" uv run --no-sync --offline python \
            scripts/generate_final_manifest.py
          git add FINAL_FILE_MANIFEST.json

          uv run --no-sync --offline python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/pr12-exact-completion.yml",
              "BUILD_PROVENANCE.json",
              "DEPENDENCY_SECURITY_SCAN_REPORT.json",
              "FINAL_FILE_MANIFEST.json",
              "LICENSE_INVENTORY.json",
              "SUPPLY_CHAIN_SBOM.json",
              "cloudflare/runner-control-plane/src/index.ts",
              "liltweak/providers/self_hosted/galor_tweak_runner.py",
              "tests/test_pr12_review_regressions.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  "unexpected staged paths: "
                  f"missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )
          PY
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" uv run --no-sync --offline python \
            scripts/generate_final_manifest.py --check

      - name: Commit and push the exact reviewed candidate
        id: final
        shell: bash
        env:
          GIT_AUTHOR_NAME: GALOR Verification
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: GALOR Verification
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git commit -m "Fix PR 12 review findings and refresh evidence"
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Exact repaired candidate: $final_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck the committed exact tree
        shell: bash
        env:
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain)"
          uv run --no-sync --offline ruff check .
          uv run --no-sync --offline ruff format --check .
          uv run --no-sync --offline mypy
          uv run --no-sync --offline pytest -q
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" uv run --no-sync --offline python \
            scripts/generate_final_manifest.py --check --commit HEAD

      - name: Dispatch fresh Gate 3 for the exact repaired commit
        id: gate3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          dispatched="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -nc \
            --arg ref "$TARGET_BRANCH" \
            --arg sha "$FINAL_SHA" \
            '{ref:$ref,inputs:{expected_commit:$sha,acknowledge_candidate_only:"true"}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/runner-qualification.yml/dispatches" \
            --data "$payload"

          run_id=""
          conclusion=""
          for _ in $(seq 1 180); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/runner-qualification.yml/runs?event=workflow_dispatch&branch=$TARGET_BRANCH&per_page=20")"
            run_id="$(jq -r \
              --arg sha "$FINAL_SHA" \
              --arg dispatched "$dispatched" \
              '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $dispatched)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r \
                --argjson id "$run_id" \
                '.workflow_runs[] | select(.id == $id) | .status' \
                <<<"$runs")"
              conclusion="$(jq -r \
                --argjson id "$run_id" \
                '.workflow_runs[] | select(.id == $id) | .conclusion // empty' \
                <<<"$runs")"
              if [[ "$status" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$conclusion" = "success"

          artifacts="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          jq -e '.artifacts | any(.expired == false and (.name | startswith("phase71-attestation-")))' \
            <<<"$artifacts" >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Fresh exact-head Gate 3 succeeded in run $run_id." >> "$GITHUB_STEP_SUMMARY"

  fixed-jobs:
    name: Execute fixed Job A and Job B on the qualified runner
    needs: repair-and-qualify
    runs-on:
      - self-hosted
      - Linux
      - X64
      - galor-tweak-runner-01
      - role-tweak-runner
    timeout-minutes: 30
    steps:
      - name: Checkout the exact qualified candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair-and-qualify.outputs.final_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove runner identity and exact source
        shell: bash
        env:
          FINAL_SHA: ${{ needs.repair-and-qualify.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "galor-tweak-runner-01"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain)"
          python3 --version

      - name: Discover and execute only the documented fixed activation jobs
        shell: bash
        env:
          FINAL_SHA: ${{ needs.repair-and-qualify.outputs.final_sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: feature/tweak-private-runner-control-plane-20260901
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import argparse
          import os
          import re
          import runpy
          import shlex
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any

          script = Path("scripts/private_runner_operator.py").resolve()
          if not script.is_file():
              raise SystemExit("private runner operator is missing")

          class ParserCaptured(Exception):
              pass

          captured: list[argparse.ArgumentParser] = []
          original_parse_args = argparse.ArgumentParser.parse_args
          original_parse_known_args = argparse.ArgumentParser.parse_known_args

          def capture_args(self: argparse.ArgumentParser, *args: Any, **kwargs: Any) -> Any:
              captured.append(self)
              raise ParserCaptured

          argparse.ArgumentParser.parse_args = capture_args
          argparse.ArgumentParser.parse_known_args = capture_args
          old_argv = sys.argv[:]
          sys.argv = [str(script)]
          try:
              try:
                  runpy.run_path(str(script), run_name="__main__")
              except ParserCaptured:
                  pass
              except SystemExit as exc:
                  if exc.code not in (0, None):
                      raise
          finally:
              sys.argv = old_argv
              argparse.ArgumentParser.parse_args = original_parse_args
              argparse.ArgumentParser.parse_known_args = original_parse_known_args

          if not captured:
              raise SystemExit("could not inspect the operator CLI safely")
          parser = captured[-1]

          def subcommands(p: argparse.ArgumentParser) -> dict[str, argparse.ArgumentParser]:
              for action in p._actions:
                  if isinstance(action, argparse._SubParsersAction):
                      return dict(action.choices)
              return {}

          def semantic_text(name: str, p: argparse.ArgumentParser) -> str:
              parts = [name, p.description or "", p.epilog or ""]
              for action in p._actions:
                  parts.extend(
                      [
                          action.dest or "",
                          action.help or "",
                          " ".join(action.option_strings),
                          " ".join(str(choice) for choice in (action.choices or [])),
                      ]
                  )
              return re.sub(r"[_-]+", " ", " ".join(parts).lower())

          commands = subcommands(parser)
          dangerous = re.compile(r"\b(delete|destroy|rotate|revoke|teardown|uninstall|provision)\b")
          job_a: list[tuple[str, argparse.ArgumentParser]] = []
          job_b: list[tuple[str, argparse.ArgumentParser]] = []
          combined: list[tuple[str, argparse.ArgumentParser]] = []
          for name, command_parser in commands.items():
              text = semantic_text(name, command_parser)
              if dangerous.search(re.sub(r"[_-]+", " ", name.lower())):
                  continue
              has_a = bool(re.search(r"\bjob\s*a\b|\bfixed\s*a\b", text))
              has_b = bool(re.search(r"\bjob\s*b\b|\bfixed\s*b\b", text))
              if has_a and has_b:
                  combined.append((name, command_parser))
              elif has_a:
                  job_a.append((name, command_parser))
              elif has_b:
                  job_b.append((name, command_parser))

          final_sha = os.environ["FINAL_SHA"]
          repository = os.environ["TARGET_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          evidence_dir = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "liltweak-fixed-job-evidence"
          evidence_dir.mkdir(parents=True, exist_ok=True)

          def supplied_value(action: argparse.Action, job: str) -> str | None:
              dest = (action.dest or "").lower()
              choices = [str(choice) for choice in (action.choices or [])]
              if any(word in dest for word in ("commit", "revision", "sha")):
                  return final_sha
              if dest in {"repository", "repo", "repository_full_name"}:
                  return repository
              if dest in {"branch", "ref", "candidate_ref"}:
                  return branch
              if "job" in dest and choices:
                  for choice in choices:
                      normalized = re.sub(r"[_-]+", " ", choice.lower())
                      if re.search(rf"\b{job.lower()}\b|job\s*{job.lower()}", normalized):
                          return choice
              if "timeout" in dest:
                  return "300"
              if any(word in dest for word in ("output", "evidence", "receipt")):
                  return str(evidence_dir / f"job-{job.lower()}.json")
              env_names = [dest.upper(), f"LILTWEAK_{dest.upper()}", f"GALOR_{dest.upper()}"]
              for env_name in env_names:
                  value = os.environ.get(env_name)
                  if value:
                      return value
              return None

          def build_args(
              command_name: str | None,
              command_parser: argparse.ArgumentParser,
              job: str,
          ) -> list[str]:
              args = [sys.executable, str(script)]
              root_actions = [
                  action
                  for action in parser._actions
                  if not isinstance(action, (argparse._HelpAction, argparse._SubParsersAction))
              ]
              command_actions = [
                  action
                  for action in command_parser._actions
                  if not isinstance(action, argparse._HelpAction)
              ]
              for action in root_actions:
                  if not action.required:
                      continue
                  value = supplied_value(action, job)
                  if value is None:
                      raise SystemExit(f"unresolved required operator option: {action.dest}")
                  if action.option_strings:
                      args.extend([action.option_strings[0], value])
                  else:
                      args.append(value)
              if command_name is not None:
                  args.append(command_name)
              for action in command_actions:
                  value = supplied_value(action, job)
                  if action.required and value is None:
                      raise SystemExit(
                          f"unresolved required {command_name or 'operator'} option: {action.dest}"
                      )
                  if value is None:
                      continue
                  if action.option_strings:
                      args.extend([action.option_strings[0], value])
                  elif action.required:
                      args.append(value)
              return args

          def run_command(args: list[str], label: str) -> None:
              safe = [
                  "<redacted>" if re.search(r"token|secret|credential|bearer|key", item, re.I) else item
                  for item in args
              ]
              print(f"Executing documented {label}: {shlex.join(safe)}")
              completed = subprocess.run(
                  args,
                  cwd=script.parents[1],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=600,
                  check=False,
              )
              log_path = evidence_dir / f"{label.replace(' ', '-').lower()}.log"
              log_path.write_text(completed.stdout, encoding="utf-8")
              if completed.returncode != 0:
                  tail = "\n".join(completed.stdout.splitlines()[-30:])
                  raise SystemExit(
                      f"{label} failed with exit {completed.returncode}; sanitized tail:\n{tail}"
                  )

          if len(combined) == 1:
              name, command_parser = combined[0]
              run_command(build_args(name, command_parser, "A"), "fixed-jobs-a-and-b")
          elif len(job_a) == 1 and len(job_b) == 1:
              name_a, parser_a = job_a[0]
              name_b, parser_b = job_b[0]
              run_command(build_args(name_a, parser_a, "A"), "job-a")
              run_command(build_args(name_b, parser_b, "B"), "job-b")
          else:
              root_text = semantic_text("operator", parser)
              job_action = next(
                  (
                      action
                      for action in parser._actions
                      if "job" in (action.dest or "").lower() and action.choices
                  ),
                  None,
              )
              if job_action is not None and re.search(r"\bjob\s*a\b", root_text) and re.search(
                  r"\bjob\s*b\b", root_text
              ):
                  run_command(build_args(None, parser, "A"), "job-a")
                  run_command(build_args(None, parser, "B"), "job-b")
              else:
                  names = ", ".join(sorted(commands)) or "no subcommands"
                  raise SystemExit(
                      "operator CLI did not expose one unambiguous fixed Job A/Job B path; "
                      f"available commands: {names}"
                  )

          if subprocess.run(["git", "diff", "--quiet"], cwd=script.parents[1]).returncode != 0:
              raise SystemExit("fixed-job execution changed the checked-out source tree")
          print("Both fixed activation jobs returned success without modifying source.")
          PY

      - name: Confirm the runner service remains active
        shell: bash
        run: |
          set -euo pipefail
          active=""
          for unit in lil-tweak-runner.service liltweak-runner.service galor-tweak-runner.service; do
            if systemctl list-unit-files "$unit" --no-legend 2>/dev/null | grep -q "$unit"; then
              systemctl is-active --quiet "$unit"
              active="$unit"
              break
            fi
          done
          test -n "$active"
          echo "Runner service remains active: $active" >> "$GITHUB_STEP_SUMMARY"

  certify:
    name: Certify the exact PR head for merge
    needs:
      - repair-and-qualify
      - fixed-jobs
    runs-on: ubuntu-24.04
    if: ${{ success() }}
    steps:
      - name: Verify PR head and publish bounded evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ needs.repair-and-qualify.outputs.final_sha }}
          GATE3_RUN_ID: ${{ needs.repair-and-qualify.outputs.gate3_run_id }}
        run: |
          set -euo pipefail
          pr="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/12")"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$FINAL_SHA"

          status_payload="$(jq -nc \
            --arg context "pr12/exact-activation" \
            --arg description "Full tests, fresh Gate 3, Job A and Job B passed" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:"success",context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            --data "$status_payload" >/dev/null

          comment="$(cat <<EOF
          Exact PR #12 activation candidate verified.

          - Candidate: \`$FINAL_SHA\`
          - Full locked Python and Worker gates: passed
          - Two reviewed defects: repaired with regression coverage
          - Fresh exact-head Gate 3: passed in run \`$GATE3_RUN_ID\`
          - Fixed Job A: passed on \`galor-tweak-runner-01\`
          - Fixed Job B: passed on \`galor-tweak-runner-01\`
          - Runner service: active after execution
          - Source tree: unchanged after live jobs

          This evidence authorizes merge of this exact SHA only.
          EOF
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/12/comments" \
            --data "$(jq -nc --arg body "$comment" '{body:$body}')" >/dev/null
          echo "$comment" >> "$GITHUB_STEP_SUMMARY"
