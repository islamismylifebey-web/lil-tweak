name: Runner Ed25519 evidence TDD

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.33"
          enable-cache: "false"
      - name: Locked install
        run: uv sync --locked --group dev --python 3.12.13
      - name: Execute Ed25519 evidence contracts
        run: >-
          uv run --no-sync pytest -q
          tests/test_runner_ed25519_gate.py
          tests/test_runner_connection_authorization_gate.py
