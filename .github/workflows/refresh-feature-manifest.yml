name: Refresh exact feature manifest

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829

permissions:
  contents: write

concurrency:
  group: refresh-runner-handshake-feature-manifest
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/runner-health-handshake-heartbeat-20260829
          fetch-depth: 1
          persist-credentials: true

      - name: Regenerate manifest and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF_NAME" = "feature/runner-health-handshake-heartbeat-20260829"
          git config user.name "GALOR Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refresh-feature-manifest.yml
          python scripts/generate_final_manifest.py
          git add FINAL_FILE_MANIFEST.json
          git diff --cached --check
          git commit -m "chore: refresh exact feature manifest"
          git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829
