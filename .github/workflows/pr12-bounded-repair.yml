name: PR 12 exact source handoff

on:
  push:
    branches:
      - feature/tweak-private-runner-control-plane-20260901

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: /tmp/liltweak-uv-cache
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false

      - name: Verify bounded source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF" = "refs/heads/feature/tweak-private-runner-control-plane-20260901"
          test "$(git rev-parse HEAD^)" = "c08a0aa482ec5582c20465346af0c4d3f54307f1"
          test "$(git log -1 --pretty=%s)" = "chore: package exact PR 12 source toolchain"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/pr12-bounded-repair.yml"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: "false"
          download-from-astral-mirror: "false"
          add-problem-matchers: "false"

      - name: Install exact locked environments
        shell: bash
        run: |
          set -Eeuo pipefail
          uv lock --check --offline
          uv sync --locked --group dev --python 3.12.13
          uv sync --check --offline --group dev --python 3.12.13
          npm ci --prefix cloudflare/runner-control-plane

      - name: Create credential-free exact-tree and toolchain archive
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --get-regexp 'http\..*extraheader' && exit 1 || true
          staging="$RUNNER_TEMP/pr12-handoff"
          rm -rf "$staging"
          mkdir -p "$staging/source" "$staging/toolchain"
          tar -cf - \
            --exclude='.git/config' \
            --exclude='.git/logs' \
            --exclude='.git/hooks' \
            . | tar -xf - -C "$staging/source"
          cp -a /opt/hostedtoolcache/Python/3.12.13/x64 \
            "$staging/toolchain/python-3.12.13"
          cp "$(command -v uv)" "$staging/toolchain/uv-0.11.33"
          printf '%s\n' "$(python --version 2>&1)" > "$staging/toolchain/python-version.txt"
          printf '%s\n' "$(uv --version)" > "$staging/toolchain/uv-version.txt"
          tar -czf "$RUNNER_TEMP/pr12-exact-source-toolchain.tgz" -C "$staging" .
          test -s "$RUNNER_TEMP/pr12-exact-source-toolchain.tgz"

      - name: Upload exact source, locked environments, and toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr12-exact-source-toolchain-${{ github.run_id }}
          path: ${{ runner.temp }}/pr12-exact-source-toolchain.tgz
          if-no-files-found: error
          retention-days: 1
