name: Sites v22 Baseline Verify

on:
  push:
    branches:
      - ci/sites-v22-baseline-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Locked Node install
        run: npm ci
      - name: Install Core package
        run: python3 -m pip install --disable-pip-version-check -e ./core
      - name: Full repository verification
        run: npm run verify
