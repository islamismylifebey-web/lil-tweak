name: Gate 3 Lil Tweak integration

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829
    paths:
      - .github/workflows/gate3-liltweak-integrate.yml

permissions:
  contents: write

concurrency:
  group: gate3-liltweak-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/runner-health-handshake-heartbeat-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply, test, and publish atomically
        shell: bash
        run: |
          set +e
          original="$GITHUB_SHA"
          rm -f GATE3_LILTWEAK_VERIFIED.txt GATE3_LILTWEAK_FAILED.txt GATE3_LILTWEAK_FAILURE.log

          python3 scripts/gate3_integrate_liltweak.py > /tmp/gate3-apply.log 2>&1
          apply_status=$?
          install_status=99
          test_status=99
          lint_status=99
          type_status=99
          compile_status=99

          if [ "$apply_status" -eq 0 ]; then
            python -m pip install --disable-pip-version-check "uv==0.8.13" > /tmp/gate3-install.log 2>&1
            install_status=$?
          fi
          if [ "$install_status" -eq 0 ]; then
            uv sync --frozen >> /tmp/gate3-install.log 2>&1
            install_status=$?
          fi
          if [ "$install_status" -eq 0 ]; then
            uv run pytest -q \
              tests/test_runner_ed25519_gate.py \
              tests/test_runner_gate3_connection.py \
              tests/test_runner_connection_authorization_gate.py \
              tests/test_runner_connection_probe.py \
              tests/test_galor_runner_v2.py > /tmp/gate3-tests.log 2>&1
            test_status=$?
          fi
          if [ "$test_status" -eq 0 ]; then
            uv run ruff check liltweak tests/test_runner_ed25519_gate.py tests/test_runner_gate3_connection.py tests/test_runner_connection_authorization_gate.py tests/test_runner_connection_probe.py tests/test_galor_runner_v2.py > /tmp/gate3-lint.log 2>&1
            lint_status=$?
          fi
          if [ "$lint_status" -eq 0 ]; then
            uv run mypy liltweak > /tmp/gate3-types.log 2>&1
            type_status=$?
          fi
          if [ "$type_status" -eq 0 ]; then
            python -m compileall -q liltweak tests/test_runner_gate3_connection.py > /tmp/gate3-compile.log 2>&1
            compile_status=$?
          fi

          git config user.name "liltweak-gate3-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "$apply_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$lint_status" -eq 0 ] && [ "$type_status" -eq 0 ] && [ "$compile_status" -eq 0 ]; then
            git rm -r --ignore-unmatch \
              .github/workflows/gate3-liltweak-integrate.yml \
              GATE3_LILTWEAK_FAILED.txt \
              GATE3_LILTWEAK_FAILURE.log
            printf 'gate3-liltweak-focused-verification-v1\n' > GATE3_LILTWEAK_VERIFIED.txt
            git add -A
            git diff --cached --check
            git commit -m "feat: enforce cryptographic qualification and authorization gates"
            git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829
            exit 0
          fi

          git reset --hard "$original"
          printf 'gate3-liltweak-focused-verification-failed-v1\n' > GATE3_LILTWEAK_FAILED.txt
          {
            printf 'apply=%s\ninstall=%s\ntests=%s\nlint=%s\ntypecheck=%s\ncompile=%s\nsource=%s\n\n' \
              "$apply_status" "$install_status" "$test_status" "$lint_status" "$type_status" "$compile_status" "$original"
            for file in apply install tests lint types compile; do
              printf '%s\n' "--- $file ---"
              tail -n 400 "/tmp/gate3-$file.log" 2>/dev/null || true
            done
          } > GATE3_LILTWEAK_FAILURE.log
          git add GATE3_LILTWEAK_FAILED.txt\n          git add -f GATE3_LILTWEAK_FAILURE.log
          git commit -m "chore: record Lil Tweak Gate 3 integration blocker" || true
          git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829
          exit 1
