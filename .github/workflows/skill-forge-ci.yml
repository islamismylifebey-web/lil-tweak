name: Skill Forge V1 CI

on:
  pull_request:
    paths:
      - "core/lil_tweak/skill_forge/**"
      - "core/tests/test_skill_forge*.py"
      - "examples/skill-forge-*.json"
      - "docs/skill-forge.md"
      - "docs/superpowers/**/*skill-forge*"
      - ".github/workflows/skill-forge-ci.yml"

permissions:
  contents: read

concurrency:
  group: skill-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Exact candidate and scoped Skill Forge boundary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check "$BASE_SHA" HEAD
          python3 - <<'PY'
          import os
          import subprocess
          allowed = ("core/lil_tweak/skill_forge/", "core/tests/test_skill_forge",
                     "examples/skill-forge-", "docs/skill-forge.md",
                     "docs/superpowers/specs/2026-09-05-skill-forge-",
                     "docs/superpowers/plans/2026-09-05-skill-forge-",
                     ".github/workflows/skill-forge-ci.yml")
          changes = subprocess.check_output(
              ["git", "diff", "--name-status", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          assert changes, "No Skill Forge implementation changes"
          for line in changes:
              status, path = line.split("\t")
              assert status in {"A", "M"} and path.startswith(allowed), line
          print(f"Verified {len(changes)} scoped Skill Forge files against current PR base")
          PY
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-forge"
          chmod 700 "$RUNNER_TEMP/lil-tweak-forge"
          echo "TMPDIR=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Focused contracts and adversarial tests
        run: python3 -m unittest discover -s core/tests -p 'test_skill_forge*.py' -v
      - name: Scoped Python static checks
        run: |
          python3 -m pip install ruff==0.12.10 mypy==1.17.1
          python3 -m ruff check core/lil_tweak/skill_forge core/tests/test_skill_forge*.py
          python3 -m mypy --strict core/lil_tweak/skill_forge
      - name: Compiler command smoke test
        run: |
          PYTHONPATH=core python3 -m lil_tweak.skill_forge validate < examples/skill-forge-icon-inspector.json
          PYTHONPATH=core python3 -m lil_tweak.skill_forge preview < examples/skill-forge-icon-inspector.json > "$RUNNER_TEMP/skill-preview.md"
      - run: npm ci
      - name: Full canonical repository verification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:core

          set +e
          npm run test:deploy >"$RUNNER_TEMP/head-deploy.log" 2>&1
          head_status=$?
          set -e
          cat "$RUNNER_TEMP/head-deploy.log"
          if [[ "$head_status" -eq 0 ]]; then
            exit 0
          fi

          baseline="$RUNNER_TEMP/skill-forge-base"
          git worktree add --detach "$baseline" "$BASE_SHA"
          set +e
          (
            cd "$baseline"
            python3 -B scripts/run-deploy-tests.py
          ) >"$RUNNER_TEMP/base-deploy.log" 2>&1
          base_status=$?
          set -e

          if [[ "$base_status" -eq 0 ]]; then
            echo "Head introduced deploy-test failures that do not exist on the PR base." >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          def signature(path: str) -> tuple[list[str], str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              cases = sorted(set(re.findall(r"^(?:FAIL|ERROR): (.+)$", text, re.MULTILINE)))
              summaries = re.findall(r"^FAILED \(([^\n]+)\)$", text, re.MULTILINE)
              summary = summaries[-1] if summaries else ""
              return cases, summary

          head = signature(Path(__import__("os").environ["RUNNER_TEMP"]) / "head-deploy.log")
          base = signature(Path(__import__("os").environ["RUNNER_TEMP"]) / "base-deploy.log")
          if not head[0]:
              raise SystemExit("Head deploy suite failed without parseable failure cases")
          if head != base:
              print("Head deploy failure signature:", head)
              print("Base deploy failure signature:", base)
              raise SystemExit("Deploy failures differ from current PR base")
          print(f"Accepted exact base deploy failure signature: {len(head[0])} cases; {head[1]}")
          PY
      - name: Confirm checks did not change source
        run: git diff --exit-code
