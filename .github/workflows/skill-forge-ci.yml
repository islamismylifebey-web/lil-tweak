name: Skill Forge V1 CI

on:
  pull_request:
    paths:
      - "core/lil_tweak/skill_forge/**"
      - "core/tests/test_skill_forge*.py"
      - "examples/skill-forge-*.json"
      - "docs/skill-forge.md"
      - "docs/superpowers/**/*skill-forge*"
      - ".github/workflows/skill-forge-ci.yml"

permissions:
  contents: read

concurrency:
  group: skill-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Exact candidate and additive boundary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check 6f59d8ddc95db083e062a5b4b626df13fcdfcbf0 HEAD
          python3 - <<'PY'
          import subprocess
          allowed = ("core/lil_tweak/skill_forge/", "core/tests/test_skill_forge",
                     "examples/skill-forge-", "docs/skill-forge.md",
                     "docs/superpowers/specs/2026-09-05-skill-forge-",
                     "docs/superpowers/plans/2026-09-05-skill-forge-",
                     ".github/workflows/skill-forge-ci.yml")
          changes = subprocess.check_output(
              ["git", "diff", "--name-status", "6f59d8ddc95db083e062a5b4b626df13fcdfcbf0", "HEAD"],
              text=True,
          ).splitlines()
          assert changes, "No implementation changes"
          for line in changes:
              status, path = line.split("\t")
              assert status == "A" and path.startswith(allowed), line
          print(f"Verified {len(changes)} additive files; existing source unchanged")
          PY
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-forge"
          chmod 700 "$RUNNER_TEMP/lil-tweak-forge"
          echo "TMPDIR=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/lil-tweak-forge" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Focused contracts and adversarial tests
        run: python3 -m unittest discover -s core/tests -p 'test_skill_forge*.py' -v
      - name: Scoped Python static checks
        run: |
          python3 -m pip install ruff==0.12.10 mypy==1.17.1
          python3 -m ruff check core/lil_tweak/skill_forge core/tests/test_skill_forge*.py
          python3 -m mypy --strict core/lil_tweak/skill_forge
      - name: Compiler command smoke test
        run: |
          PYTHONPATH=core python3 -m lil_tweak.skill_forge validate < examples/skill-forge-icon-inspector.json
          PYTHONPATH=core python3 -m lil_tweak.skill_forge preview < examples/skill-forge-icon-inspector.json > "$RUNNER_TEMP/skill-preview.md"
      - run: npm ci
      - name: Full canonical repository verification
        run: npm run verify
      - name: Confirm checks did not change source
        run: git diff --exit-code
