name: Apply Tueiq Test World core wiring patch

on:
  push:
    branches:
      - feature/tueiq-durable-test-world
    paths:
      - ".github/workflows/tueiq-main-wiring-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tueiq-durable-test-world
          fetch-depth: 0
      - name: Wire Test World into trusted core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("core/main.py")
          text = main.read_text()
          old_import = "from lil_tweak.store import PostgresJobStore\n"
          new_import = """from lil_tweak.store import PostgresJobStore
from lil_tweak.test_world_api import TestWorldApi
from lil_tweak.test_world_postgres import PostgresTestWorldStore
from lil_tweak.test_world_runner import TestWorldAttemptRunner
from lil_tweak.test_world_runtime import TestWorldRuntime
from lil_tweak.test_world_scheduler import TestWorldScheduler
"""
          if old_import not in text:
              raise SystemExit("main import anchor missing")
          text = text.replace(old_import, new_import, 1)

          anchor = "\n\ndef build_app(environ: dict[str, str] | None = None) -> Any:\n"
          helper = r'''


def _build_test_world_app(
    *,
    config: Any,
    job_store: Any,
    responses: Any,
    reviewed_instructions: str,
    work_root: Path,
    connect: Any,
    fallback: Any,
) -> Any:
    """Compose the Test World around the existing trusted-core application."""

    world_store = PostgresTestWorldStore(connect)
    world_worker_id = f"test-world-{uuid.uuid4()}"
    world_lease_seconds = min(60, max(15, config.job_timeout_seconds // 4))
    runtime = TestWorldRuntime(
        work_root=work_root,
        runner_image=config.runner_image,
        git_allowed_hosts=config.git_allowed_hosts,
        responses_client=responses,
        model=config.openai_model,
        instructions=reviewed_instructions,
        job_timeout_seconds=config.job_timeout_seconds,
    )
    runner = TestWorldAttemptRunner(
        store=world_store,
        worker_id=world_worker_id,
        lease_seconds=world_lease_seconds,
        prepare_workspace=runtime.prepare_workspace,
        apply_previous_patch=runtime.apply_previous_patch,
        run_agent=runtime.run_agent,
        capture_cumulative_patch=runtime.capture_cumulative_patch,
        run_check=runtime.run_check,
        cleanup_workspace=runtime.cleanup_workspace,
    )
    scheduler = TestWorldScheduler(
        world_store,
        runner,
        worker_id=world_worker_id,
        lease_seconds=world_lease_seconds,
        execution_guard=lambda: runtime_execution_lock(work_root),
    )
    scheduler.start()
    return TestWorldApi(
        fallback=fallback,
        nonce_store=job_store,
        world_store=world_store,
        signing_keys=config.signing_keys,
        canonical_owner_id=config.canonical_owner_id,
        on_attempt_queued=scheduler.notify,
    )
'''
          if anchor not in text:
              raise SystemExit("build_app anchor missing")
          text = text.replace(anchor, helper + anchor, 1)

          old_return = '''    return create_app(
        store=store,
        signing_keys=config.signing_keys,
        canonical_owner_id=config.canonical_owner_id,
        readiness=readiness,
        evidence_store=evidence_store,
        on_job_queued=scheduler.notify,
    )
'''
          new_return = '''    base_app = create_app(
        store=store,
        signing_keys=config.signing_keys,
        canonical_owner_id=config.canonical_owner_id,
        readiness=readiness,
        evidence_store=evidence_store,
        on_job_queued=scheduler.notify,
    )
    return _build_test_world_app(
        config=config,
        job_store=store,
        responses=responses,
        reviewed_instructions=reviewed_instructions,
        work_root=work_root,
        connect=lambda: psycopg.connect(config.database_url),
        fallback=base_app,
    )
'''
          if old_return not in text:
              raise SystemExit("create_app return anchor missing")
          text = text.replace(old_return, new_return, 1)
          main.write_text(text)

          runtime = Path("core/lil_tweak/test_world_runtime.py")
          text = runtime.read_text()
          old = '''        hosts = tuple(git_allowed_hosts)
        if not hosts or any(not isinstance(item, str) or not item for item in hosts):
            raise ValueError("git allowlist is required")
'''
          new = '''        hosts = tuple(git_allowed_hosts)
        if any(not isinstance(item, str) or not item for item in hosts):
            raise ValueError("invalid git allowlist")
'''
          if old not in text:
              raise SystemExit("runtime allowlist anchor missing")
          runtime.write_text(text.replace(old, new, 1))
          PY
      - name: Commit wiring patch
        run: |
          git config user.name "Tueiq Test World CI"
          git config user.email "actions@users.noreply.github.com"
          git add core/main.py core/lil_tweak/test_world_runtime.py
          git diff --cached --check
          git commit -m "feat: wire Test World into Tueiq trusted core"
          git push origin HEAD:feature/tueiq-durable-test-world
