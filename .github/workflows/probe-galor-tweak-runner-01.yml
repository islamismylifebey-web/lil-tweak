name: Retire Stale Runner Probe

on:
  push:
    branches:
      - ops/probe-galor-tweak-runner-01-20260904

permissions:
  contents: read

concurrency:
  group: probe-galor-tweak-runner-01
  cancel-in-progress: true

jobs:
  retire-probe:
    name: Retire stale runner probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm no self-hosted runner claim
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Stale supervisor probe retired; no self-hosted runner requested."
