name: Runner V3 GitHub-first worker

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character source commit to execute
        required: true
        type: string
      manifest_base64:
        description: Canonical Runner V3 manifest encoded as base64
        required: true
        type: string
      manifest_digest:
        description: Expected SHA-256 digest from the Runner V3 manifest
        required: true
        type: string
      acknowledge_builder_only:
        description: Builder evidence is not independent verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runner-v3-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.expected_commit || github.run_id }}
  cancel-in-progress: false

jobs:
  runner-v3:
    name: Execute bounded Runner V3 job
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNNER_V3_PROFILE_ID: galor-tweak-runner-v3-github-01
      RUNNER_V3_OUTPUT_DIR: ${{ runner.temp }}/runner-v3-output
      RUNNER_V3_MANIFEST_PATH: ${{ runner.temp }}/runner-v3-manifest.json
      RUNNER_V3_LABEL: ubuntu-24.04
      UV_CACHE_DIR: /tmp/liltweak-uv-cache
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LC_ALL: C.UTF-8
      NO_COLOR: "1"
      GIT_TERMINAL_PROMPT: "0"
      OPENAI_API_KEY: ""
      LILTWEAK_LIVE_MODEL_ENABLED: "false"
      LILTWEAK_REPOSITORY_EXECUTION_ENABLED: "false"

    steps:
      - name: Checkout exact Runner V3 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.event.pull_request.head.sha }}
          clean: true
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false
          download-from-astral-mirror: false
          add-problem-matchers: false

      - name: Install exact locked Runner V3 environment
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.13"
          uv --version | grep -Eq '^uv 0\.11\.33([[:space:]]|$)'
          uv lock --check --offline
          uv sync --locked --group dev --python 3.12.13
          uv sync --check --offline --group dev --python 3.12.13

      - name: Prepare exact Runner V3 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test ! -e "$RUNNER_V3_MANIFEST_PATH"
          test ! -e "$RUNNER_V3_OUTPUT_DIR"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            uv run --no-sync --offline python scripts/runner_v3_smoke_manifest.py \
              --workspace "$GITHUB_WORKSPACE" \
              --output "$RUNNER_V3_MANIFEST_PATH"
          else
            uv run --no-sync --offline python - <<'PY'
          import base64
          import json
          import os
          import re
          import secrets
          from pathlib import Path

          from liltweak.creator_contract import canonical_json
          from liltweak.providers.github.runner_v3_contracts import (
              RunnerV3JobManifest,
          )

          def reject_duplicate_keys(
              pairs: list[tuple[str, object]],
          ) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate manifest JSON key")
                  result[key] = value
              return result

          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          inputs = event.get("inputs")
          if not isinstance(inputs, dict):
              raise SystemExit("Runner V3 dispatch inputs are unavailable")
          acknowledgement = inputs.get("acknowledge_builder_only")
          if acknowledgement not in (True, "true"):
              raise SystemExit("Runner V3 builder-only acknowledgement is required")
          encoded = inputs.get("manifest_base64")
          if not isinstance(encoded, str) or not encoded or len(encoded) > 60_000:
              raise SystemExit("Runner V3 encoded manifest is invalid")
          try:
              raw = base64.b64decode(encoded.encode("ascii"), validate=True)
          except (UnicodeEncodeError, ValueError) as exc:
              raise SystemExit("Runner V3 manifest base64 is invalid") from exc
          if len(raw) > 45_000:
              raise SystemExit("Runner V3 decoded manifest exceeds dispatch limits")
          try:
              payload = json.loads(
                  raw.decode("utf-8", errors="strict"),
                  object_pairs_hook=reject_duplicate_keys,
              )
              manifest = RunnerV3JobManifest.model_validate(payload)
          except (UnicodeDecodeError, ValueError) as exc:
              raise SystemExit("Runner V3 manifest schema or digest is invalid") from exc
          expected_digest = inputs.get("manifest_digest")
          if (
              not isinstance(expected_digest, str)
              or not re.fullmatch(r"[0-9a-f]{64}", expected_digest)
              or not secrets.compare_digest(
                  expected_digest,
                  manifest.manifest_digest,
              )
          ):
              raise SystemExit("Runner V3 manifest digest does not match dispatch")
          expected_commit = inputs.get("expected_commit")
          if (
              not isinstance(expected_commit, str)
              or not re.fullmatch(r"[0-9a-f]{40}", expected_commit)
              or manifest.source_commit != expected_commit
          ):
              raise SystemExit("Runner V3 source commit does not match dispatch")
          expected_repository = f"github:{os.environ['GITHUB_REPOSITORY']}"
          if manifest.repository_id != expected_repository:
              raise SystemExit("Runner V3 repository does not match this workflow")
          if manifest.runner_profile_id != os.environ["RUNNER_V3_PROFILE_ID"]:
              raise SystemExit("Runner V3 profile does not match this workflow")
          canonical = (
              f"{canonical_json(manifest.model_dump(mode='json'))}\n".encode()
          )
          if len(canonical) > 45_000:
              raise SystemExit("Runner V3 canonical manifest exceeds dispatch limits")
          path = Path(os.environ["RUNNER_V3_MANIFEST_PATH"])
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          flags |= getattr(os, "O_NOFOLLOW", 0)
          descriptor = os.open(path, flags, 0o600)
          try:
              view = memoryview(canonical)
              while view:
                  written = os.write(descriptor, view)
                  if written <= 0:
                      raise SystemExit("Runner V3 manifest write was incomplete")
                  view = view[written:]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
          fi

      - name: Execute bounded Runner V3 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --no-sync --offline python scripts/runner_v3.py \
            --manifest "$RUNNER_V3_MANIFEST_PATH" \
            --workspace "$GITHUB_WORKSPACE" \
            --output-directory "$RUNNER_V3_OUTPUT_DIR"

      - name: Upload bounded Runner V3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNNER_V3_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Remove ephemeral Runner V3 material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- "$RUNNER_V3_MANIFEST_PATH"
          rm -rf -- "$RUNNER_V3_OUTPUT_DIR"
