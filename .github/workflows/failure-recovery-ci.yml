name: Failure Recovery Engine CI

on:
  pull_request:
    paths:
      - "core/lil_tweak/failure_recovery/**"
      - "core/tests/test_failure_recovery_*.py"
      - "docs/superpowers/specs/2026-09-04-failure-recovery-engine-v1-design.md"
      - "docs/superpowers/plans/2026-09-04-failure-recovery-engine-v1.md"
      - ".github/workflows/failure-recovery-ci.yml"
  push:
    branches:
      - feature/failure-recovery-engine-v1

permissions:
  contents: read

concurrency:
  group: failure-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create runner-owned temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-recovery"
          chmod 700 "$RUNNER_TEMP/lil-tweak-recovery"
      - name: Compile recovery package
        env:
          TMPDIR: ${{ runner.temp }}/lil-tweak-recovery
          TMP: ${{ runner.temp }}/lil-tweak-recovery
          TEMP: ${{ runner.temp }}/lil-tweak-recovery
        run: python3 -m compileall -q core/lil_tweak/failure_recovery core/tests/test_failure_recovery_*.py
      - name: Focused recovery tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}/lil-tweak-recovery
          TMP: ${{ runner.temp }}/lil-tweak-recovery
          TEMP: ${{ runner.temp }}/lil-tweak-recovery
        run: |
          python3 -m unittest \
            core.tests.test_failure_recovery_contracts \
            core.tests.test_failure_recovery_controller \
            core.tests.test_failure_recovery_history \
            core.tests.test_failure_recovery_orchestrator \
            core.tests.test_failure_recovery_security
      - name: Validate diff
        run: git diff --check "${{ github.event.pull_request.base.sha || 'HEAD^' }}"..HEAD

  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Create runner-owned temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-recovery"
          chmod 700 "$RUNNER_TEMP/lil-tweak-recovery"
      - run: npm ci
      - name: Full repository verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}/lil-tweak-recovery
          TMP: ${{ runner.temp }}/lil-tweak-recovery
          TEMP: ${{ runner.temp }}/lil-tweak-recovery
        run: npm run verify
