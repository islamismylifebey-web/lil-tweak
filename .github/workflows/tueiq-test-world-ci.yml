name: Tueiq Test World CI

on:
  push:
    branches:
      - feature/tueiq-durable-test-world
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "lib/**"
      - "tests/**"
      - "deploy/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/tueiq-test-world-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Create runner-owned temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-ci"
          chmod 700 "$RUNNER_TEMP/lil-tweak-ci"
      - name: Test World focused core contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}/lil-tweak-ci
          TMP: ${{ runner.temp }}/lil-tweak-ci
          TEMP: ${{ runner.temp }}/lil-tweak-ci
        run: python3 -m unittest core.tests.test_test_world core.tests.test_test_world_schema core.tests.test_test_world_api core.tests.test_test_world_runner core.tests.test_test_world_invariants core.tests.test_test_world_modes core.tests.test_test_world_runtime core.tests.test_test_world_scheduler core.tests.test_test_world_main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Full repository verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}/lil-tweak-ci
          TMP: ${{ runner.temp }}/lil-tweak-ci
          TEMP: ${{ runner.temp }}/lil-tweak-ci
        run: npm run verify
