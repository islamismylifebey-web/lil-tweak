name: Runner V3 scratch cleanup finalizer

on:
  push:
    branches:
      - feature/runner-v3-github-first-factory-01

permissions:
  contents: write

concurrency:
  group: runner-v3-scratch-cleanup-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: "github.event.head_commit.message == 'chore: trigger Runner V3 scratch cleanup fix'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: /tmp/liltweak-uv-cache
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LC_ALL: C.UTF-8
      NO_COLOR: "1"
      GIT_TERMINAL_PROMPT: "0"
      OPENAI_API_KEY: ""
      LILTWEAK_LIVE_MODEL_ENABLED: "false"
      LILTWEAK_REPOSITORY_EXECUTION_ENABLED: "false"

    steps:
      - name: Checkout exact cleanup trigger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 2
          ref: ${{ github.sha }}
          clean: true
          lfs: false
          submodules: false

      - name: Verify exact starting point
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF" = "refs/heads/feature/runner-v3-github-first-factory-01"
          test "$(git rev-parse HEAD^)" = "355b424c36d5273f4e694ddeb7b4132ac4c4a57e"
          test "$(git log -1 --pretty=%s)" = "chore: trigger Runner V3 scratch cleanup fix"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/runner-v3-cleanup-finalize.yml"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false
          download-from-astral-mirror: false
          add-problem-matchers: false

      - name: Move runtime scratch outside evidence with guaranteed cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("liltweak/providers/github/runner_v3_executor.py")
          source = path.read_text(encoding="utf-8")

          old_import = "import subprocess\nimport sys\nimport time\n"
          new_import = "import subprocess\nimport sys\nimport tempfile\nimport time\n"
          assert source.count(old_import) == 1
          source = source.replace(old_import, new_import, 1)

          old_environment = '''def _child_environment(output_directory: Path) -> dict[str, str]:
              home = output_directory / "home"
              temporary = output_directory / "tmp"
              pycache = output_directory / "pycache"
              ruff_cache = output_directory / "ruff-cache"
              mypy_cache = output_directory / "mypy-cache"
          '''.replace("          ", "")
          new_environment = '''def _create_runtime_directory(output_directory: Path) -> Path:
              try:
                  runtime_directory = Path(
                      tempfile.mkdtemp(
                          prefix=".runner-v3-runtime-",
                          dir=output_directory.parent,
                      )
                  )
                  runtime_directory.chmod(0o700)
              except OSError as exc:
                  raise RunnerV3ExecutionError(
                      "Runner V3 runtime scratch could not be created"
                  ) from exc
              return runtime_directory


          def _remove_runtime_directory(runtime_directory: Path) -> None:
              try:
                  metadata = runtime_directory.lstat()
              except FileNotFoundError:
                  return
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise RunnerV3ExecutionError(
                      "Runner V3 runtime scratch changed before cleanup"
                  )
              try:
                  shutil.rmtree(runtime_directory)
              except OSError as exc:
                  raise RunnerV3ExecutionError(
                      "Runner V3 runtime scratch could not be removed"
                  ) from exc


          def _child_environment(runtime_directory: Path) -> dict[str, str]:
              home = runtime_directory / "home"
              temporary = runtime_directory / "tmp"
              pycache = runtime_directory / "pycache"
              ruff_cache = runtime_directory / "ruff-cache"
              mypy_cache = runtime_directory / "mypy-cache"
          '''.replace("          ", "")
          assert source.count(old_environment) == 1
          source = source.replace(old_environment, new_environment, 1)

          start_marker = "        environment = _child_environment(output_directory)\n\n"
          end_marker = "        return receipt\n"
          assert source.count(start_marker) == 1
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          block = source[start:end].replace(
              "environment = _child_environment(output_directory)",
              "environment = _child_environment(runtime_directory)",
              1,
          )
          replacement = (
              "        runtime_directory = _create_runtime_directory(output_directory)\n"
              "        try:\n"
              + textwrap.indent(block, "    ")
              + "        finally:\n"
              "            _remove_runtime_directory(runtime_directory)\n"
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

      - name: Prove cleanup and all focused Runner V3 behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          uv lock --check --offline
          uv sync --locked --group dev --python 3.12.13
          uv sync --check --offline --group dev --python 3.12.13
          uv run --no-sync --offline ruff format \
            liltweak/providers/github/runner_v3_executor.py
          uv run --no-sync --offline pytest -q \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py \
            tests/test_runner_v3_evidence_cleanup.py \
            tests/test_runner_v3_profile.py \
            tests/test_runner_v3_workflow.py \
            tests/test_execution_lease.py
          uv run --no-sync --offline ruff check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            liltweak/providers/github/runner_v3_profile.py \
            scripts/runner_v3.py \
            scripts/runner_v3_smoke_manifest.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py \
            tests/test_runner_v3_evidence_cleanup.py \
            tests/test_runner_v3_profile.py \
            tests/test_runner_v3_workflow.py
          uv run --no-sync --offline ruff format --check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            liltweak/providers/github/runner_v3_profile.py \
            scripts/runner_v3.py \
            scripts/runner_v3_smoke_manifest.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py \
            tests/test_runner_v3_evidence_cleanup.py \
            tests/test_runner_v3_profile.py \
            tests/test_runner_v3_workflow.py
          uv run --no-sync --offline mypy \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            liltweak/providers/github/runner_v3_profile.py \
            scripts/runner_v3.py \
            scripts/runner_v3_smoke_manifest.py

      - name: Remove finalizer and commit exact result
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/runner-v3-cleanup-finalize.yml
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          .github/workflows/runner-v3-cleanup-finalize.yml
          liltweak/providers/github/runner_v3_executor.py
          EOF
          git diff HEAD --name-only | sort > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --check
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liltweak/providers/github/runner_v3_executor.py
          git commit -m "fix: keep Runner V3 runtime scratch out of evidence"
          git push origin HEAD:feature/runner-v3-github-first-factory-01
