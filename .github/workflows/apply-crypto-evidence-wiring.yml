name: Apply cryptographic evidence runtime wiring

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829

permissions:
  contents: write

concurrency:
  group: apply-runner-crypto-evidence-wiring
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/runner-health-handshake-heartbeat-20260829
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Apply exact runtime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              matches = [index for index, line in enumerate(lines) if line == anchor]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one anchor in {path}: {anchor!r}; found {len(matches)}"
                  )
              index = matches[0] + 1
              new_lines = lines[:index] + addition.splitlines() + lines[index:]
              target.write_text("\n".join(new_lines) + "\n", encoding="utf-8")

          def insert_before(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              matches = [index for index, line in enumerate(lines) if line == anchor]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one anchor in {path}: {anchor!r}; found {len(matches)}"
                  )
              index = matches[0]
              new_lines = lines[:index] + addition.splitlines() + lines[index:]
              target.write_text("\n".join(new_lines) + "\n", encoding="utf-8")

          def replace_line(path: str, old: str, replacement: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              matches = [index for index, line in enumerate(lines) if line == old]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one line in {path}: {old!r}; found {len(matches)}"
                  )
              index = matches[0]
              new_lines = lines[:index] + replacement.splitlines() + lines[index + 1 :]
              target.write_text("\n".join(new_lines) + "\n", encoding="utf-8")

          insert_after(
              "liltweak/galor_runner_v2.py",
              "    repository_commit: str",
              "    authorization_signing_keys: Mapping[str, str] = field(default_factory=dict, repr=False)",
          )
          insert_after(
              "liltweak/galor_runner_v2.py",
              "            execution_host=config.contract.execution_host,",
              "            contract_digest=config.expected_contract_digest,\n"
              "            qualification_evidence_digest=config.qualification_evidence_digest,",
          )
          insert_after(
              "liltweak/galor_runner_v2.py",
              "            authorization_digest=config.authorization_digest,",
              "            authorization_signing_keys=config.authorization_signing_keys,",
          )

          insert_after(
              "liltweak/config.py",
              "    workbench_runner_auth_token: str | None = field(default=None, repr=False)",
              "    workbench_runner_authorization_signing_keys_json: str | None = None",
          )
          insert_after(
              "liltweak/config.py",
              "                (\"LILTWEAK_WORKBENCH_RUNNER_AUTH_TOKEN\", self.workbench_runner_auth_token),",
              "                (\n"
              "                    \"LILTWEAK_WORKBENCH_RUNNER_AUTHORIZATION_SIGNING_KEYS_JSON\",\n"
              "                    self.workbench_runner_authorization_signing_keys_json,\n"
              "                ),\n"
              "                (\n"
              "                    \"LILTWEAK_WORKBENCH_RUNNER_SIGNING_KEYS_JSON\",\n"
              "                    self.workbench_runner_signing_keys_json,\n"
              "                ),",
          )
          insert_before(
              "liltweak/config.py",
              "            workbench_runner_signing_keys_json=_json_text_env(",
              "            workbench_runner_authorization_signing_keys_json=_json_text_env(\n"
              "                \"LILTWEAK_WORKBENCH_RUNNER_AUTHORIZATION_SIGNING_KEYS_JSON\"\n"
              "            ),",
          )

          replace_line(
              "liltweak/api.py",
              "from .runner_connection import parse_result_signing_keys",
              "from .runner_connection import (\n"
              "    parse_authorization_signing_keys,\n"
              "    parse_result_signing_keys,\n"
              ")",
          )
          insert_after(
              "liltweak/api.py",
              "            settings.workbench_runner_auth_token,",
              "            settings.workbench_runner_authorization_signing_keys_json,",
          )
          insert_before(
              "liltweak/api.py",
              "        result_signing_keys = parse_result_signing_keys(settings.workbench_runner_signing_keys_json)",
              "        authorization_signing_keys = parse_authorization_signing_keys(\n"
              "            settings.workbench_runner_authorization_signing_keys_json\n"
              "        )",
          )
          insert_after(
              "liltweak/api.py",
              "                workspace_root=settings.workbench_workspace_root,",
              "                authorization_signing_keys=authorization_signing_keys,",
          )

          insert_after(
              ".env.example",
              "LILTWEAK_WORKBENCH_RUNNER_AUTH_TOKEN=",
              "LILTWEAK_WORKBENCH_RUNNER_AUTHORIZATION_SIGNING_KEYS_JSON=",
          )

          insert_after(
              "tests/test_galor_runner_v2.py",
              "        repository_commit=COMMIT,",
              "        authorization_signing_keys={\n"
              "            \"executor-authorization-key\": \"executor-authorization-secret-value\"\n"
              "        },\n"
              "        result_signing_keys={\"runner-result-key\": \"runner-result-secret-value\"},",
          )
          PY

      - name: Format changed Python files
        shell: bash
        run: |
          set -Eeuo pipefail
          uv sync --locked --group dev --python 3.12.13
          uv run --no-sync ruff format \
            liltweak/runner_connection.py \
            liltweak/galor_runner_v2.py \
            liltweak/config.py \
            liltweak/api.py \
            tests/test_galor_runner_v2.py \
            tests/test_runner_connection_probe.py \
            tests/test_runner_cryptographic_evidence.py
          uv run --no-sync ruff check \
            liltweak/runner_connection.py \
            liltweak/galor_runner_v2.py \
            liltweak/config.py \
            liltweak/api.py \
            tests/test_galor_runner_v2.py \
            tests/test_runner_connection_probe.py \
            tests/test_runner_cryptographic_evidence.py

      - name: Commit exact tree and refreshed manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF_NAME" = "feature/runner-health-handshake-heartbeat-20260829"
          git config user.name "GALOR Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-crypto-evidence-wiring.yml
          git add \
            .env.example \
            liltweak/runner_connection.py \
            liltweak/galor_runner_v2.py \
            liltweak/config.py \
            liltweak/api.py \
            tests/test_galor_runner_v2.py \
            tests/test_runner_connection_probe.py \
            tests/test_runner_cryptographic_evidence.py
          python scripts/generate_final_manifest.py
          git add FINAL_FILE_MANIFEST.json
          git diff --cached --check
          git commit -m "feat: wire cryptographic runner evidence"
          git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829