name: Apply runner connection wiring

on:
  push:
    branches:
      - feature/runner-health-handshake-heartbeat-20260829

permissions:
  contents: write

concurrency:
  group: apply-runner-connection-wiring
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/runner-health-handshake-heartbeat-20260829
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: ""

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Apply exact production wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "liltweak/galor_runner_v2.py"
          replace_once(path, "from dataclasses import dataclass\n", "from dataclasses import dataclass, field\n")
          replace_once(
              path,
              "import httpx\n\nfrom .workbench_contract import NetworkMode, ToolKind, ToolRequest\n",
              "import httpx\n\nfrom .runner_connection import (\n"
              "    RunnerConnectionProof,\n"
              "    RunnerConnectionVerifier,\n"
              ")\n"
              "from .workbench_contract import NetworkMode, ToolKind, ToolRequest\n",
          )
          replace_once(
              path,
              '        "runner.prepareLocalCommit",\n',
              '        "runner.prepareLocalCommit",\n        "runner.reportIdentity",\n',
          )
          replace_once(
              path,
              "class GalorWorkGatewayClient(Protocol):\n"
              "    async def create_approval(self, payload: Mapping[str, object]) -> Mapping[str, object]: ...\n",
              "class GalorWorkGatewayClient(Protocol):\n"
              "    async def handshake(self, payload: Mapping[str, object]) -> Mapping[str, object]: ...\n"
              "    async def create_approval(self, payload: Mapping[str, object]) -> Mapping[str, object]: ...\n",
          )
          replace_once(
              path,
              "    async def create_approval(self, payload: Mapping[str, object]) -> Mapping[str, object]:\n"
              "        return await self._json(\"POST\", \"/api/executor/approvals/action\", payload)\n",
              "    async def handshake(self, payload: Mapping[str, object]) -> Mapping[str, object]:\n"
              "        return await self._json(\"POST\", \"/api/executor/handshake\", payload)\n\n"
              "    async def create_approval(self, payload: Mapping[str, object]) -> Mapping[str, object]:\n"
              "        return await self._json(\"POST\", \"/api/executor/approvals/action\", payload)\n",
          )
          replace_once(
              path,
              "    repository_id: str\n    repository_commit: str\n\n\n@dataclass\n",
              "    repository_id: str\n"
              "    repository_commit: str\n"
              "    result_signing_keys: Mapping[str, str] = field(default_factory=dict, repr=False)\n\n\n@dataclass\n",
          )
          replace_once(
              path,
              '        self._disconnect_reason = "GALOR Runner V2 is connected and authorized"\n',
              "        self._connection = RunnerConnectionVerifier(\n"
              "            gateway=self._gateway,\n"
              "            execution_host=config.contract.execution_host,\n"
              "            authorization_digest=config.authorization_digest,\n"
              "            result_signing_keys=config.result_signing_keys,\n"
              "            now=self._now,\n"
              "            poll_interval_seconds=self._poll_interval_seconds,\n"
              "        )\n",
          )
          replace_once(
              path,
              "    @property\n    def connected(self) -> bool:\n        return True\n",
              "    @property\n"
              "    def connected(self) -> bool:\n"
              "        return self._connection.connected\n",
          )
          replace_once(
              path,
              "    @property\n"
              "    def disconnect_reason(self) -> str:\n"
              "        return self._disconnect_reason\n\n"
              "    def action_for_request(self, request: ToolRequest) -> str:\n",
              "    @property\n"
              "    def disconnect_reason(self) -> str:\n"
              "        return self._connection.disconnect_reason\n\n"
              "    async def refresh_connection(self) -> RunnerConnectionProof:\n"
              "        return await self._connection.refresh()\n\n"
              "    def action_for_request(self, request: ToolRequest) -> str:\n",
          )

          path = "liltweak/api.py"
          replace_once(
              path,
              "from .repository import RepositoryAccessError, RepositoryInspectionError, RepositoryInspector\n"
              "from .service import (\n",
              "from .repository import RepositoryAccessError, RepositoryInspectionError, RepositoryInspector\n"
              "from .runner_connection import parse_result_signing_keys\n"
              "from .service import (\n",
          )
          replace_once(
              path,
              "            settings.workbench_runner_auth_token,\n"
              "            settings.workbench_runner_repository_id,\n",
              "            settings.workbench_runner_auth_token,\n"
              "            settings.workbench_runner_signing_keys_json,\n"
              "            settings.workbench_runner_repository_id,\n",
          )
          replace_once(
              path,
              "        authorization_digest = str(settings.workbench_runner_authorization_digest)\n"
              "        contract = CanonicalGalorRunnerContract.from_json(\n",
              "        authorization_digest = str(settings.workbench_runner_authorization_digest)\n"
              "        result_signing_keys = parse_result_signing_keys(\n"
              "            settings.workbench_runner_signing_keys_json\n"
              "        )\n"
              "        contract = CanonicalGalorRunnerContract.from_json(\n",
          )
          replace_once(
              path,
              "                repository_commit=str(settings.workbench_runner_repository_commit),\n"
              "            )\n",
              "                repository_commit=str(settings.workbench_runner_repository_commit),\n"
              "                result_signing_keys=result_signing_keys,\n"
              "            )\n",
          )

          path = "liltweak/workbench_executor.py"
          replace_once(
              path,
              "    @property\n"
              "    def disconnect_reason(self) -> str:\n"
              "        value = getattr(self.transport, \"disconnect_reason\", None)\n"
              "        if isinstance(value, str) and value.strip():\n"
              "            return value\n"
              "        return \"qualified bounded command runner is disconnected\"\n\n"
              "    def cancel(self, task_id: str) -> None:\n",
              "    @property\n"
              "    def disconnect_reason(self) -> str:\n"
              "        value = getattr(self.transport, \"disconnect_reason\", None)\n"
              "        if isinstance(value, str) and value.strip():\n"
              "            return value\n"
              "        return \"qualified bounded command runner is disconnected\"\n\n"
              "    async def refresh_connection(self) -> bool:\n"
              "        if not self._transport_enabled:\n"
              "            return False\n"
              "        refresh = getattr(self.transport, \"refresh_connection\", None)\n"
              "        if callable(refresh):\n"
              "            try:\n"
              "                await refresh()\n"
              "            except ExecutorUnavailableError:\n"
              "                return False\n"
              "        return self.connected\n\n"
              "    def cancel(self, task_id: str) -> None:\n",
          )
          replace_once(
              path,
              "            if not self.connected:\n"
              "                raise ExecutorUnavailableError(self.disconnect_reason)\n",
              "            if not self.connected and not await self.refresh_connection():\n"
              "                raise ExecutorUnavailableError(self.disconnect_reason)\n",
          )

          path = "liltweak/workbench_api.py"
          replace_once(
              path,
              "    async def health(\n"
              "        _session: Annotated[Session, Depends(require_session)],\n"
              "        task_id: str | None = None,\n"
              "    ) -> WorkbenchHealth:\n"
              "        return controller.health(task_id)\n",
              "    async def health(\n"
              "        _session: Annotated[Session, Depends(require_session)],\n"
              "        task_id: str | None = None,\n"
              "    ) -> WorkbenchHealth:\n"
              "        await controller.executor.refresh_connection()\n"
              "        return controller.health(task_id)\n",
          )
          PY

      - name: Format and verify changed Python
        shell: bash
        run: |
          set -Eeuo pipefail
          uv sync --locked --group dev --python 3.12.13
          uv run --no-sync ruff format \
            liltweak/galor_runner_v2.py \
            liltweak/runner_connection.py \
            liltweak/api.py \
            liltweak/workbench_executor.py \
            liltweak/workbench_api.py \
            tests/test_runner_connection_probe.py
          uv run --no-sync ruff check \
            liltweak/galor_runner_v2.py \
            liltweak/runner_connection.py \
            liltweak/api.py \
            liltweak/workbench_executor.py \
            liltweak/workbench_api.py \
            tests/test_runner_connection_probe.py
          python -m compileall -q liltweak

      - name: Commit exact source and refreshed manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF_NAME" = "feature/runner-health-handshake-heartbeat-20260829"
          git config user.name "GALOR Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-runner-connection-wiring.yml
          python scripts/generate_final_manifest.py
          git add \
            FINAL_FILE_MANIFEST.json \
            liltweak/galor_runner_v2.py \
            liltweak/runner_connection.py \
            liltweak/api.py \
            liltweak/workbench_executor.py \
            liltweak/workbench_api.py \
            tests/test_runner_connection_probe.py
          git diff --cached --check
          git commit -m "feat: require authenticated runner handshake and heartbeat"
          git push origin HEAD:feature/runner-health-handshake-heartbeat-20260829
