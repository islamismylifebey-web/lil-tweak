name: Tueeq Forge Machine V1 CI

on:
  push:
    branches:
      - feature/tueeq-forge-machine-v1
  pull_request:
    paths:
      - "core/lil_tweak/forge_machine/**"
      - "core/tests/test_forge_machine.py"
      - "docs/tueeq-forge-machine.md"
      - "docs/superpowers/specs/2026-09-07-tueeq-forge-machine-v1-design.md"
      - "docs/superpowers/plans/2026-09-07-tueeq-forge-machine-v1.md"
      - ".github/workflows/forge-machine-ci.yml"

permissions:
  contents: read

concurrency:
  group: forge-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Create private Forge temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/lil-tweak-forge-machine"
          chmod 700 "$RUNNER_TEMP/lil-tweak-forge-machine"
          echo "TMPDIR=$RUNNER_TEMP/lil-tweak-forge-machine" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/lil-tweak-forge-machine" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/lil-tweak-forge-machine" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Confirm Forge diff is additive and bounded
        shell: bash
        run: |
          unexpected="$(
            git diff --name-only origin/main...HEAD \
              | grep -Ev '^(core/lil_tweak/forge_machine/|core/tests/test_forge_machine\.py$|docs/tueeq-forge-machine\.md$|docs/superpowers/specs/2026-09-07-tueeq-forge-machine-v1-design\.md$|docs/superpowers/plans/2026-09-07-tueeq-forge-machine-v1\.md$|\.github/workflows/forge-machine-ci\.yml$)' \
              || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'Forge branch touched out-of-scope paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Focused Forge machine contracts
        run: python3 -m unittest core.tests.test_forge_machine -v
      - name: Forge static checks
        run: |
          python3 -m pip install ruff==0.12.10 mypy==1.17.1
          python3 -m ruff check core/lil_tweak/forge_machine core/tests/test_forge_machine.py
          python3 -m mypy --strict --follow-imports=silent core/lil_tweak/forge_machine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Canonical verification with exact main-baseline guard
        shell: bash
        run: |
          # main currently contains an intentional emergency zero-token chat route,
          # while one pre-existing rendered-html assertion still expects OPENAI_API_KEY.
          # Prove that mismatch exists on main before accepting exactly that one
          # baseline failure; any additional or different failure remains blocking.
          git show origin/main:app/api/chat/route.ts | grep -F 'MODEL_CALLS_DISABLED' >/dev/null
          if git show origin/main:app/api/chat/route.ts | grep -F 'OPENAI_API_KEY' >/dev/null; then
            echo 'Main baseline changed: chat route now contains OPENAI_API_KEY; remove the baseline exception.' >&2
            exit 1
          fi
          git show origin/main:tests/rendered-html.test.mjs \
            | grep -F 'assert.match(chatRoute, /OPENAI_API_KEY/);' >/dev/null

          set +e
          npm run verify >"$RUNNER_TEMP/forge-full-verify.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/forge-full-verify.log"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          grep -F 'ℹ fail 1' "$RUNNER_TEMP/forge-full-verify.log" >/dev/null
          grep -F 'leaves authentication, API, model, runner, and approval contracts untouched' \
            "$RUNNER_TEMP/forge-full-verify.log" >/dev/null
          grep -F 'expected: /OPENAI_API_KEY/' "$RUNNER_TEMP/forge-full-verify.log" >/dev/null

          # npm run verify stops before Python core tests when the known frontend
          # baseline assertion fails, so run the canonical core suite explicitly.
          npm run test:core
      - name: Confirm verification did not mutate source
        run: git diff --exit-code
