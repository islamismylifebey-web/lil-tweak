name: Runner V3 focused TDD

on:
  push:
    branches:
      - feature/runner-v3-github-first-factory-01

permissions:
  contents: read

concurrency:
  group: runner-v3-focused-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Runner V3 focused checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: /tmp/liltweak-uv-cache
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LC_ALL: C.UTF-8
      NO_COLOR: "1"
      GIT_TERMINAL_PROMPT: "0"
      OPENAI_API_KEY: ""
      LILTWEAK_LIVE_MODEL_ENABLED: "false"
      LILTWEAK_REPOSITORY_EXECUTION_ENABLED: "false"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
          clean: true
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false
          download-from-astral-mirror: false
          add-problem-matchers: false

      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.13"
          uv --version | grep -Eq '^uv 0\.11\.33([[:space:]]|$)'
          uv lock --check --offline
          uv sync --locked --group dev --python 3.12.13
          uv sync --check --offline --group dev --python 3.12.13

      - name: Run Runner V3 focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --no-sync --offline pytest -q \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py \
            tests/test_execution_lease.py
          uv run --no-sync --offline ruff check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            scripts/runner_v3.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py
          uv run --no-sync --offline ruff format --check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            scripts/runner_v3.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_runner_v3_executor.py
          uv run --no-sync --offline mypy \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            liltweak/providers/github/runner_v3_executor.py \
            scripts/runner_v3.py
