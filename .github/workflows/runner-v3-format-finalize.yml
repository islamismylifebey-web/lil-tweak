name: Runner V3 exact formatter

on:
  push:
    branches:
      - feature/runner-v3-github-first-factory-01

permissions:
  contents: write

concurrency:
  group: runner-v3-exact-formatter
  cancel-in-progress: false

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: retry Runner V3 formatter'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: /tmp/liltweak-uv-cache
      UV_NO_PROGRESS: "1"
      UV_LINK_MODE: copy
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LC_ALL: C.UTF-8
      NO_COLOR: "1"
      GIT_TERMINAL_PROMPT: "0"
      OPENAI_API_KEY: ""
      LILTWEAK_LIVE_MODEL_ENABLED: "false"
      LILTWEAK_REPOSITORY_EXECUTION_ENABLED: "false"

    steps:
      - name: Checkout exact formatter trigger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 2
          ref: ${{ github.sha }}
          clean: true
          lfs: false
          submodules: false

      - name: Verify exact starting point
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "islamismylifebey-web/lil-tweak"
          test "$GITHUB_REF" = "refs/heads/feature/runner-v3-github-first-factory-01"
          test "$(git rev-parse HEAD^)" = "3df27378fa5d55f61582554e640baef50056da2c"
          test "$(git log -1 --pretty=%s)" = "chore: retry Runner V3 formatter"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/runner-v3-format-finalize.yml"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false
          download-from-astral-mirror: false
          add-problem-matchers: false

      - name: Apply exact Ruff formatting and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          uv lock --check --offline
          uv sync --locked --group dev --python 3.12.13
          uv run --no-sync --offline ruff format \
            liltweak/providers/github/runner_v3.py \
            tests/test_runner_v3_provider.py
          uv run --no-sync --offline pytest -q \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py \
            tests/test_execution_lease.py
          uv run --no-sync --offline ruff check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py
          uv run --no-sync --offline ruff format --check \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py \
            tests/test_runner_v3_contracts.py \
            tests/test_runner_v3_provider.py
          uv run --no-sync --offline mypy \
            liltweak/providers/github/runner_v3_contracts.py \
            liltweak/providers/github/runner_v3.py

      - name: Remove formatter and commit exact result
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/runner-v3-format-finalize.yml
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          .github/workflows/runner-v3-format-finalize.yml
          liltweak/providers/github/runner_v3.py
          tests/test_runner_v3_provider.py
          EOF
          git diff HEAD --name-only | sort > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --check
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liltweak/providers/github/runner_v3.py tests/test_runner_v3_provider.py
          git commit -m "style: apply exact Runner V3 formatting"
          git push origin HEAD:feature/runner-v3-github-first-factory-01
