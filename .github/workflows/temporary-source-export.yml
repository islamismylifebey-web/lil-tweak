name: Temporary exact source export

on:
  push:
    branches:
      - tooling/source-export-liltweak-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Package repository including Git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "$RUNNER_TEMP/lil-tweak-repository.tgz" .
      - name: Upload exact repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lil-tweak-exact-source
          path: ${{ runner.temp }}/lil-tweak-repository.tgz
          if-no-files-found: error
          retention-days: 1
