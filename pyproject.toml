[project]
name = "lil-tweak-engine"
version = "0.7.1"
description = "Independent, API-first, evidence-driven software-engineering engine."
readme = "README.md"
license-files = []
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "openai-agents>=0.8,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["docs*", "liltweak*", "migrations*", "runner*", "web*"]
exclude = ["evals*", "scripts*", "tests*"]
namespaces = true

[tool.setuptools.package-data]
docs = [
  "creator-live-prompt.md",
  "engineering-prompt.md",
  "prompt.md",
  "workbench-agent-prompt.md",
]
migrations = ["*.sql"]
"web.workbench" = ["*.css", "*.html", "*.js"]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pillow>=11,<13",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "setuptools==82.0.1",
  "types-setuptools==82.0.0.20260518",
  "wheel==0.47.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["liltweak", "scripts", "main.py", "build_backend.py"]
plugins = ["pydantic.mypy"]
strict = true
show_error_codes = true
pretty = false
warn_unused_configs = true
incremental = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
